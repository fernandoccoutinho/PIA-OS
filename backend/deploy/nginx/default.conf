# default.conf — proxy reverso para a API do PIA-OS.
#
# Sem certificado HTTPS real nesta etapa (Módulo 2.11 explicitamente não
# configura certificados) — o bloco `server` HTTPS abaixo fica comentado,
# como referência estrutural para quando um certificado real existir
# (Let's Encrypt/certbot, ou um certificado gerenciado pelo provedor de
# nuvem — nenhum dos dois é decidido aqui).

upstream pia_os_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Cabeçalhos de segurança na borda — redundantes com os que a própria
    # aplicação já aplica (Módulo 2.8, SecurityMiddleware), mas manter
    # aqui também é defesa em profundidade: cobre qualquer resposta que
    # não passe pela aplicação (ex.: uma página de erro do próprio nginx).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10M;  # espelha MAX_REQUEST_SIZE_BYTES padrão (Módulo 2.8)

    location / {
        proxy_pass http://pia_os_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Healthcheck do próprio nginx (não confundir com o /api/v1/health da
    # aplicação, que passa pelo upstream) — útil para um load balancer de
    # borda checar só se o nginx está respondendo.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

