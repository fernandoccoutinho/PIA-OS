# docker-compose.dev.yml — desenvolvimento local, hot reload.
#
#   docker compose -f deploy/compose/docker-compose.dev.yml up
#
# Autocontido (não é um override do docker-compose.yml base) — roda
# isoladamente sem precisar de `-f` duplo. Recursos com nome próprio
# (container_name, volumes, network) para poder rodar lado a lado com o
# ambiente base/prod na mesma máquina sem colidir.

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dev
    container_name: pia_os_api_dev
    env_file:
      - ../../.env
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pia_os_dev_network
    volumes:
      - ../..:/srv/app  # bind mount — hot reload via --reload do uvicorn

  db:
    image: postgres:16-alpine
    container_name: pia_os_db_dev
    environment:
      POSTGRES_USER: ${DB_USER:-pia_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pia_password}
      POSTGRES_DB: ${DB_NAME:-pia_os}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pia_os_dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pia_user} -d ${DB_NAME:-pia_os}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pia_os_dev_network

networks:
  pia_os_dev_network:
    driver: bridge

volumes:
  pia_os_dev_db_data:
