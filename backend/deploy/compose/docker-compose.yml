# docker-compose.yml — base, self-hosted "just funciona".
#
# `docker compose -f deploy/compose/docker-compose.yml up` sobe api + db
# e nada mais. Redis e Nginx estão definidos (estrutura pronta, conforme
# pedido) mas atrás de `profiles:` — não sobem por padrão. Para incluí-los:
# `docker compose --profile with-redis --profile with-proxy up`.
#
# Contexto de build é a raiz de `backend/` (dois níveis acima deste
# arquivo) — os Dockerfiles precisam enxergar `requirements/`, `app/`,
# `main.py`.

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: pia_os_api
    env_file:
      - ../../.env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pia_os_network
    restart: unless-stopped
    # Logs vão para stdout/stderr (Módulo 2.6, LOG_DESTINATION=console
    # por padrão) — o driver de log do Docker (json-file por padrão)
    # já persiste isso em disco no host; ver docs/OPERATIONS.md sobre
    # como apontar para um volume/coletor externo se necessário.

  db:
    image: postgres:16-alpine
    container_name: pia_os_db
    environment:
      POSTGRES_USER: ${DB_USER:-pia_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pia_password}
      POSTGRES_DB: ${DB_NAME:-pia_os}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pia_os_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pia_user} -d ${DB_NAME:-pia_os}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pia_os_network
    restart: unless-stopped

  # --- Redis: estrutura apenas, não utilizado nesta etapa (Módulo 2.11) ---
  # Sobe apenas com `--profile with-redis`. Nenhum código da aplicação
  # se conecta a ele ainda — presente só para não exigir reestruturação
  # do Compose quando cache/filas forem adotados em um módulo futuro.
  redis:
    image: redis:7-alpine
    container_name: pia_os_redis
    profiles: ["with-redis"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - pia_os_redis_data:/data
    networks:
      - pia_os_network
    restart: unless-stopped

  # --- Nginx: estrutura apenas, sem certificados reais (Módulo 2.11) ---
  # Sobe apenas com `--profile with-proxy`. Ver deploy/nginx/ — proxy
  # reverso, compressão e headers de segurança já configurados; HTTPS
  # fica para quando houver certificados reais.
  nginx:
    image: nginx:1.27-alpine
    container_name: pia_os_nginx
    profiles: ["with-proxy"]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - pia_os_network
    restart: unless-stopped

networks:
  pia_os_network:
    driver: bridge

volumes:
  pia_os_db_data:
  pia_os_redis_data:
