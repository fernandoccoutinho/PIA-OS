[run]
source = app
omit =
    */tests/*
    */__init__.py

[report]
# Meta mínima do Módulo 2.10: 95% de cobertura da infraestrutura.
fail_under = 95
show_missing = true
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:

[html]
directory = htmlcov

[xml]
output = coverage.xml
