[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --strict-markers --cov=app --cov-config=coverage.ini --cov-report=term-missing --cov-report=html --cov-report=xml
markers =
    unit: teste unitário — isolado, sem dependências externas reais.
    integration: teste de integração — sobe a aplicação real (TestClient) e/ou depende de mais de uma camada.
    slow: teste mais lento que a média — candidato a rodar separado em CI, se a suíte crescer muito.
