name: CI Legacy Entrega 1

# Movido de legacy-entrega1/.github/workflows/ci.yml — GitHub Actions só lê
# workflows em .github/workflows/ na raiz do repositório; o arquivo
# original em legacy-entrega1/.github/workflows/ nunca era executado.
# working-directory e docker context ajustados: o workflow original
# assumia que legacy-entrega1/ era a raiz do repo (era, antes do
# backend/ ser adicionado).

on:
  push:
    branches: [main]
    paths:
      - "legacy-entrega1/**"
      - ".github/workflows/ci-legacy.yml"
  pull_request:
    branches: [main]
    paths:
      - "legacy-entrega1/**"
      - ".github/workflows/ci-legacy.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-entrega1
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Pytest
        run: pytest

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: legacy-entrega1
          push: false
          tags: pia-os:ci
